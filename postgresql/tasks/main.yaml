---

- name: Ensure prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: "{{ apt_update_cache }}"
    cache_valid_time: "{{ apt_cache_valid_time }}"
  tags: postgresql

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: postgresql

- name: Download official PostgreSQL GPG key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql.asc
    owner: root
    group: root
    mode: "0644"
    force: false
  tags: postgresql

- name: Determine APT repository architecture
  vars:
    arch_map:
      x86_64: amd64
      aarch64: arm64
      ppc64le: ppc64el
  ansible.builtin.set_fact:
    _apt_arch: "{{ arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
  tags: postgresql

- name: Add PostgreSQL repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    architectures: "{{ _apt_arch }}"
    signed_by: /etc/apt/keyrings/postgresql.asc
    state: present
  tags: postgresql

- name: Install PostgreSQL
  ansible.builtin.apt:
    name: >-
      {{
        'postgresql-' ~ postgresql_version
        if postgresql_version is defined and postgresql_version
        else 'postgresql'
      }}
    state: "{{ 'latest' if apt_update_latest else 'present' }}"
    update_cache: true
  tags:
    - postgresql
    - update
