---

name: Ansible Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v26
        with:
          requirements_file: requirements.yaml
