---

- name: Install iptables packages
  ansible.builtin.include_tasks: install.yaml

- name: Reset iptables rules (optional)
  ansible.builtin.include_tasks: reset.yaml
  when: iptables_reset | bool

- name: Apply iptables rules
  ansible.builtin.include_tasks: rules.yaml

- name: Set default chain policies
  ansible.builtin.include_tasks: policies.yaml
